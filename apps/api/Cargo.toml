[package]
name = "scout-api"
default-run = "scout-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
axum = "=0.8.9"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
object_store = { version = "=0.12.4", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
dotenvy = "=0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
ring = "0.17"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-std", "io-util"] }
deadpool-postgres = "0.14.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1.0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
