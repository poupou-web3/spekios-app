# Deliberately independent of the Spekios Compose project, network and storage.
name: spekios-posthog-demo-site
services:
  demo:
    build:
      context: ../..
      dockerfile: apps/posthog-demo/Dockerfile
    environment:
      POSTHOG_DEMO_HOST: ${POSTHOG_DEMO_HOST:-}
      POSTHOG_DEMO_UI_HOST: ${POSTHOG_DEMO_UI_HOST:-}
      POSTHOG_DEMO_TOOLBAR: ${POSTHOG_DEMO_TOOLBAR:-false}
      POSTHOG_DEMO_PROJECT_TOKEN: ${POSTHOG_DEMO_PROJECT_TOKEN:-}
    ports: ['127.0.0.1:18186:8086']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 128m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8086/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
