# Copy to secrets.yml (gitignored). Optionally encrypt it:
#   ansible-vault encrypt secrets.yml   # then add --ask-vault-pass when deploying
#
# Each key is written to the server's .env. Remove a key here and it stays on the
# server until you edit .env there; set it to "" to clear it.
