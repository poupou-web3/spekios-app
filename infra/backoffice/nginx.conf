# Operator back office: static ES modules plus a same-origin proxy to the internal Spekios API.
# This is the service provider's console. Publish it only on a private network, a VPN or behind
# an identity-aware proxy (infra/deploy uses Cloudflare Access on its own hostname), never on the
# customer workspace origin. The API still requires the operator token (SCOUT_API_TOKEN).
server {
  listen 8080;
  server_name _;
  root /srv/backoffice;
  server_tokens off;
  charset utf-8;
  charset_types text/css text/javascript;
  client_max_body_size 64k;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-store always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /_backoffice_health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = / { try_files /index.html =404; }
  location = /favicon.svg { default_type image/svg+xml; try_files /favicon.svg =404; }
  location /assets/ { types { text/javascript js; text/css css; } try_files $uri =404; }
  # Host is forwarded so the API applies its own local-development and origin rules.
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
  }
  # The Logs tab polls this every 1.5 seconds; logging each poll would feed the
  # tail its own requests.
  location = /v1/admin/logs {
    access_log off;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_read_timeout 30s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
  }
  location = /readyz { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
  location / { return 404; }
}
