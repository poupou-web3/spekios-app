name: scout-qa

services:
  api:
    image: scout-qa-api:local
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      SCOUT_API_TOKEN: ${SCOUT_API_TOKEN:?Run node scripts/setup-local.mjs}
      SCOUT_DEV_AUTH_BYPASS: ${SCOUT_DEV_AUTH_BYPASS:-false}
      SCOUT_PUBLIC_ORIGIN: ${SCOUT_PUBLIC_ORIGIN:-}
      SPEKIOS_AUTH_ORIGIN: ${SPEKIOS_AUTH_ORIGIN:-}
      SCOUT_PROVIDER_VAULT_KEY: ${SCOUT_PROVIDER_VAULT_KEY:-}
      SPEKIOS_ISSUER: ${SPEKIOS_ISSUER:-}
      SPEKIOS_CLIENT_ID: ${SPEKIOS_CLIENT_ID:-}
      SPEKIOS_CLIENT_SECRET: ${SPEKIOS_CLIENT_SECRET:-}
      SPEKIOS_REDIRECT_URI: ${SPEKIOS_REDIRECT_URI:-}
      SCOUT_API_BIND: '0.0.0.0:8080'
      PGHOST: postgres
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-scout}
      PGDATABASE: ${PGDATABASE:-scout}
      PGSSLMODE: ${PGSSLMODE:-disable}
      SCOUT_DB_POOL_MAX: ${SCOUT_DB_POOL_MAX:-8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run node scripts/setup-local.mjs}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run node scripts/setup-local.mjs}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run node scripts/setup-local.mjs}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_SPOOL: /data/gateway
      SCOUT_EXPLORER_PROVIDER: ${SCOUT_EXPLORER_PROVIDER:-openrouter}
      SCOUT_EXPLORER_MODEL: ${SCOUT_EXPLORER_MODEL:-}
      SCOUT_EXPLORER_FREE_ONLY: ${SCOUT_EXPLORER_FREE_ONLY:-true}
      SCOUT_EXPLORER_MAX_ACTIONS: ${SCOUT_EXPLORER_MAX_ACTIONS:-}
      SCOUT_EXPLORER_MAX_MINUTES: ${SCOUT_EXPLORER_MAX_MINUTES:-}
      SCOUT_EXPLORER_APP_MEMORY: ${SCOUT_EXPLORER_APP_MEMORY:-true}
      SCOUT_EXPLORER_VIEWPORT: ${SCOUT_EXPLORER_VIEWPORT:-desktop}
      SCOUT_AUTO_REPRODUCE: ${SCOUT_AUTO_REPRODUCE:-false}
      SCOUT_AUTO_REPRODUCE_MAX_CASES: ${SCOUT_AUTO_REPRODUCE_MAX_CASES:-2}
      SCOUT_AUTO_REPRODUCE_MAX_ACTIONS: ${SCOUT_AUTO_REPRODUCE_MAX_ACTIONS:-12}
      SCOUT_ALLOWED_ORIGINS: ${SCOUT_ALLOWED_ORIGINS:-http://exploration-fixture:8082,http://larchwood:8084,http://larchwood:8085}
      SCOUT_TEST_FORM_RULES: ${SCOUT_TEST_FORM_RULES:-[]}
    volumes:
      - gateway-spool:/data/gateway
    ports:
      # Loopback unless a deploy sets SCOUT_PUBLISH. The operator console stays on loopback.
      - '${SCOUT_PUBLISH:-127.0.0.1}:${SCOUT_WORKSPACE_PORT:-18080}:8080'
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, /usr/local/bin/scout-api, --healthcheck]
      interval: 5s
      timeout: 3s
      retries: 15
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped

  # Operator back office: a separate deployment from the customer workspace on the api service.
  backoffice:
    image: scout-qa-backoffice:local
    build:
      context: .
      dockerfile: infra/backoffice/Dockerfile
    ports:
      - '127.0.0.1:${SCOUT_BACKOFFICE_PORT:-18083}:8080'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/_backoffice_health']
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped

  postgres:
    image: scout-qa-postgres:local
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_USER: scout
      POSTGRES_DB: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scout -d scout']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

  evidence:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run node scripts/setup-local.mjs}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run node scripts/setup-local.mjs}
      S3_BUCKET: qa-evidence
    ports:
      - '127.0.0.1:18333:8333'
    volumes:
      - evidence-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  clickhouse:
    image: scout-qa-clickhouse:local
    build:
      context: ./infra/clickhouse
    environment:
      CLICKHOUSE_DB: scout
      CLICKHOUSE_USER: scout
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run node scripts/setup-local.mjs}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:18123:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    cpus: 2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  exploration-fixture:
    profiles: [runtime]
    image: scout-qa-recorder:local
    build:
      context: .
      dockerfile: infra/recorder/Dockerfile
    entrypoint: [./node_modules/.bin/tsx, src/fixture-cli.ts]
    networks:
      browser: {}
    ports:
      - '127.0.0.1:18082:8082'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8082/branches').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1

  # Larchwood, a small shop that ships with known bugs (apps/bug-lab/bugs.json),
  # for measuring what an exploration finds. Scout's browser uses
  # http://larchwood:8084 (bugs on) and http://larchwood:8085 (every bug fixed);
  # on this machine they are 127.0.0.1:18084 and 127.0.0.1:18085.
  larchwood:
    profiles: [runtime]
    image: scout-qa-recorder:local
    build:
      context: .
      dockerfile: infra/recorder/Dockerfile
    entrypoint: [node, /app/apps/bug-lab/server.mjs, --pair, --host, 0.0.0.0, --port, '8084']
    networks:
      browser: {}
    ports:
      - '127.0.0.1:18084:8084'
      - '127.0.0.1:18085:8085'
    healthcheck:
      test: [CMD, node, -e, "Promise.all([8084,8085].map(p=>fetch('http://127.0.0.1:'+p+'/'))).then(r=>{if(!r.every(x=>x.ok))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5

  recorder:
    profiles: [runtime]
    image: scout-qa-recorder:local
    build:
      context: .
      dockerfile: infra/recorder/Dockerfile
    environment: &recorder-environment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run node scripts/setup-local.mjs}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run node scripts/setup-local.mjs}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run node scripts/setup-local.mjs}
      RECORDER_SPOOL: /data/recorder
      SCOUT_API_URL: http://api:8080
      SCOUT_BROWSER_ENDPOINT: ws://browser-sandbox:3000/browser
      SCOUT_AUTH_VAULT: /data/auth
      SCOUT_API_TOKEN: ${SCOUT_API_TOKEN:?Run node scripts/setup-local.mjs}
      SCOUT_EXPLORER_PROVIDER: ${SCOUT_EXPLORER_PROVIDER:-openrouter}
      SCOUT_EXPLORER_MODEL: ${SCOUT_EXPLORER_MODEL:-}
      SCOUT_EXPLORER_FREE_ONLY: ${SCOUT_EXPLORER_FREE_ONLY:-true}
      SCOUT_EXPLORER_MAX_ACTIONS: ${SCOUT_EXPLORER_MAX_ACTIONS:-}
      SCOUT_EXPLORER_MAX_MINUTES: ${SCOUT_EXPLORER_MAX_MINUTES:-}
      SCOUT_EXPLORER_APP_MEMORY: ${SCOUT_EXPLORER_APP_MEMORY:-true}
      SCOUT_EXPLORER_VIEWPORT: ${SCOUT_EXPLORER_VIEWPORT:-desktop}
      SCOUT_AUTO_REPRODUCE: ${SCOUT_AUTO_REPRODUCE:-false}
      SCOUT_AUTO_REPRODUCE_MAX_CASES: ${SCOUT_AUTO_REPRODUCE_MAX_CASES:-2}
      SCOUT_AUTO_REPRODUCE_MAX_ACTIONS: ${SCOUT_AUTO_REPRODUCE_MAX_ACTIONS:-12}
      SCOUT_ALLOWED_ORIGINS: ${SCOUT_ALLOWED_ORIGINS:-http://exploration-fixture:8082,http://larchwood:8084,http://larchwood:8085}
      SCOUT_BROWSER_SLOTS: ${SCOUT_BROWSER_SLOTS:-3}
      SCOUT_TEST_FORM_RULES: ${SCOUT_TEST_FORM_RULES:-[]}
    depends_on:
      postgres: { condition: service_healthy }
      evidence: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      browser-sandbox: { condition: service_started }
    networks:
      default: {}
      browser: {}
    volumes:
      - recorder-spool:/data/recorder
      - auth-vault:/data/auth
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Demo and in-process test fixtures still launch Chromium here.
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2

  # Holds the credentials and saved logins; drives the browser in browser-sandbox.
  browser-worker:
    image: scout-qa-recorder:local
    build:
      context: .
      dockerfile: infra/recorder/Dockerfile
    entrypoint: [./node_modules/.bin/tsx, src/worker.ts]
    environment: *recorder-environment
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
      evidence: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      browser-sandbox: { condition: service_healthy }
    networks:
      default: {}
      browser: {}
    volumes:
      - recorder-spool:/data/recorder
      - auth-vault:/data/auth
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  # Runs every target site. No Scout credentials, volumes or storage network:
  # it reaches the internet, the fixture app and the worker's token-protected
  # login port only. Each replica serves one run, then exits and restarts fresh.
  # Keep the replica count equal to SCOUT_BROWSER_SLOTS.
  browser-sandbox:
    image: scout-qa-recorder:local
    build:
      context: .
      dockerfile: infra/recorder/Dockerfile
    entrypoint: [./node_modules/.bin/tsx, src/browser-server.ts]
    deploy:
      replicas: ${SCOUT_BROWSER_SLOTS:-3}
    environment:
      SCOUT_CHROMIUM_SANDBOX: ${SCOUT_CHROMIUM_SANDBOX:-true}
    networks:
      browser: {}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    # Docker's default seccomp profile (moby v27.4.0) plus one rule allowing clone,
    # unshare, setns and chroot, so Chromium can build its own namespace sandbox
    # without any capability. Linux hosts apply the default profile, which blocks
    # that; Docker Desktop runs unconfined, which hid it.
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/recorder/seccomp-chromium.json
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  # Read-only Docker API for the log collector: it answers container listing,
  # inspection, log streaming and events, and refuses everything else. Only the
  # collector can reach it, on the internal logs network.
  log-socket:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    command:
      - -loglevel=WARN
      - -listenip=0.0.0.0
      - -allowfrom=log-collector
      # Each pattern must match the whole path; the proxy anchors it.
      - -allowGET=/(v[0-9.]+/)?(_ping|version|events|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs))
      - -allowHEAD=/(v[0-9.]+/)?_ping
      - -watchdoginterval=60
      - -stoponwatchdog
      - -shutdowngracetime=5
    # The socket's group: 0 on Docker Desktop, the docker group on Linux hosts
    # (scripts/deploy.sh sets it).
    user: '65534:${SCOUT_DOCKER_GID:-0}'
    volumes:
      - ${SCOUT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      logs: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    cpus: 0.25
    restart: unless-stopped

  # Ships every container's stdout and stderr to ClickHouse for the back office
  # Logs tab (infra/logs/vector.yaml, docs/platform/logs.md).
  log-collector:
    image: timberio/vector:0.60.0-alpine@sha256:1c6a6c4c5c9de08df357fa8adbe72e5a7abcea458b0bd82de0b14ac9b79d5b31
    command: [--config, /etc/vector/vector.yaml]
    environment:
      # Read through the exec secret backend in vector.yaml, not interpolated.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run node scripts/setup-local.mjs}
      VECTOR_LOG: warn
      VECTOR_LOG_FORMAT: json
    volumes:
      - ./infra/logs/vector.yaml:/etc/vector/vector.yaml:ro
    tmpfs:
      - /var/lib/vector:size=16m,mode=1777
    networks:
      default: {}
      logs: {}
    depends_on:
      clickhouse: { condition: service_healthy }
      log-socket: { condition: service_started }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8686/health']
      interval: 5s
      timeout: 3s
      retries: 15
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

networks:
  default: {}
  # Target sites and the browser. Scout's storage, API and model gateway are not on it.
  browser: {}
  # The log collector and its Docker API proxy, with no route out.
  logs:
    internal: true

volumes:
  postgres-data:
  evidence-data:
  clickhouse-data:
  recorder-spool:
  gateway-spool:
  auth-vault:
