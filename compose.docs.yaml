name: scout-documentation

services:
  docs:
    image: scout-qa-docs:local
    build:
      context: ./apps/docs
      args:
        DOCS_SITE_URL: ${DOCS_SITE_URL:-http://localhost:18090}
        DOCS_BASE_PATH: ${DOCS_BASE_PATH:-/}
        DOCS_INDEXABLE: ${DOCS_INDEXABLE:-}
    ports:
      - '127.0.0.1:18090:8080'
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/_docs_health']
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped
